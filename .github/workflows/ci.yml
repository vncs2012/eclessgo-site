name: web-ci

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Asset budgets
        run: npm run check:assets

      - name: Donation contract
        run: npm run check:donations

      - name: Release config unit checks
        run: npm run test:release-config

      - name: Release config strict fixture
        env:
          API_BASE_URL: https://api.example.test/api/v1
          NEXT_PUBLIC_SITE_URL: https://www.example.test
          NEXT_PUBLIC_PANEL_URL: https://panel.example.test
          NEXT_PUBLIC_APP_CTA_URL: https://www.example.test/#app
          APPLE_TEAM_ID: ABCDE12345
          IOS_BUNDLE_ID: com.eclessgo.app
          ANDROID_PACKAGE_NAME: com.eclessgo.app
          ANDROID_SHA256_CERT_FINGERPRINT: AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA
        run: npm run check:release-config

      - name: Typecheck (route types + tsc)
        run: npm run typecheck

      # next start (usado pelo Playwright/Lighthouse) exige o build no
      # checkout limpo; não executar a11y antes de gerar .next.
      - name: Build
        run: npm run build:webpack

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E and accessibility tests
        run: npm run test:e2e

      - name: Configured deep-link payload E2E
        env:
          E2E_RELEASE_LINKS_CONFIGURED: "1"
          NEXT_PUBLIC_SITE_URL: https://www.example.test
          APPLE_TEAM_ID: ABCDE12345
          IOS_BUNDLE_ID: com.eclessgo.app
          ANDROID_PACKAGE_NAME: com.eclessgo.app
          ANDROID_SHA256_CERT_FINGERPRINT: AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA
        run: npm run test:e2e -- e2e/release-config.spec.ts

      - name: Church finder regression (single worker)
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:e2e:church-finder

      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore

      - name: Lighthouse CI (budgets)
        run: npm run lighthouse
